# qwen3.8-125b-a6b-mlx-v1 RANKED BENCHMARK -- STUB, NOT PROVISIONED.
#
# The REAL ranked pipeline for this track is .github/workflows/benchmark.yml,
# and that is what benchmark.json's runner.workflow names. This file is kept
# only as the fail-closed landing pad for a dispatch aimed at a per-track
# ranked workflow name. It measures nothing and scores nothing.
#
# Deliberately absent, and each one is a separate piece of work:
#   - secrets of any kind (no R2 credentials, no HF token, no signing key)
#   - R2 / hidden-golden download and sha256 + byte pin verification
#   - self-hosted runner labels (`runs-on` here is the hosted ubuntu image ON
#     PURPOSE, so a mis-dispatch cannot land on the fleet)
#   - the paired measurement dispatch, the cool gate, the seal and the
#     upload of benchmark-results-<run_id>/score.json
#
# There is no `push`, `pull_request` or `schedule` trigger: workflow_dispatch
# only, so nothing runs by accident.

name: qwen3.8 125B A6B ranked benchmark (NOT PROVISIONED)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse:
    name: fail closed
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run
        run: |
          echo "::error title=Not the ranked pipeline::this workflow measures nothing"
          cat >&2 <<'EOF2'
          This workflow is a stub. Nothing was measured and nothing was scored.

          The ranked pipeline for qwen3.8-125b-a6b-mlx-v1 is
          .github/workflows/benchmark.yml, which benchmark.json names in
          runner.workflow. Dispatch that one.

          That pipeline is itself not runnable yet. Still to land:
            1. a republished dist pair on the bench repository's shared
               qwen3.8-125b-a6b-v1 release branch, whose manifest names that
               branch, so tools/fetch-benchd.sh can resolve benchd.
            2. hidden-golden provisioning from R2, sha256 + byte pin-verified
               before use. The pins in fixtures/qwen3_8_125b_a6b_track.json
               timed_prompt_pool[] are the pending sentinel today.
            3. a self-hosted runner advertising the
               [self-hosted, macOS, qwen3.8-125b-a6b-mlx-v1] label set.
            4. the engine fork pin: Vendor/mlx-swift-lm points at an unmerged
               branch (feat/qwen4exp-ngram-table), and benchd cannot yet forward
               the n-gram row-source resource to the worker.

          Refusing with exit 1.
          EOF2
          exit 1
